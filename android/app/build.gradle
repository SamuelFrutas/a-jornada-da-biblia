plugins { id 'com.android.application' }

def ciVersionCode = System.getenv('GITHUB_RUN_NUMBER')
def buildVersionCode = ciVersionCode ? ciVersionCode.toInteger() : 2
def buildVersionName = ciVersionCode ? "1.${ciVersionCode}" : '1.1'

def stableDebugKeystore = file(System.getProperty('user.home') + '/.android/debug.keystore')
def releaseKeystorePath = System.getenv('ANDROID_KEYSTORE_PATH')

def releaseSigningReady = releaseKeystorePath && System.getenv('ANDROID_KEYSTORE_PASSWORD') && System.getenv('ANDROID_KEY_ALIAS') && System.getenv('ANDROID_KEY_PASSWORD')

android {
    namespace 'br.com.samuelmarvila.ajornadadabiblia'
    compileSdk 36
    defaultConfig {
        applicationId 'br.com.samuelmarvila.ajornadadabiblia'
        minSdk 23
        targetSdk 36
        versionCode buildVersionCode
        versionName buildVersionName
    }
    buildFeatures {
        buildConfig true
    }
    signingConfigs {
        stableDebug {
            storeFile stableDebugKeystore
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
            storeType 'JKS'
        }
        if (releaseSigningReady) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
                storeType 'JKS'
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.stableDebug
        }
        release {
            minifyEnabled false
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
        }
    }
}
